name: Spec coherence (Quint)

# Validates the canonical top-level `spec/` directory via the top-level make
# targets. While `spec/` is empty (the pilot is staged in
# contrib/luzanikita-formal-spec/), the make targets no-op and this job is a
# green skip. It activates automatically once specs land under `spec/`.

on:
  push:
    branches:
      - develop
    paths:
      - "spec/**"
      - ".formal-spec.mk"
      - ".github/workflows/spec.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "spec/**"
      - ".formal-spec.mk"
      - ".github/workflows/spec.yml"

jobs:
  quint:
    name: install · verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the pinned Quint toolchain (skips if spec/ is empty)
        run: make formal-spec-install

      - name: Verify formal specs — typecheck, invariants, tests (skips if spec/ is empty)
        run: make formal-spec-verify
